version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: zamtel-tdr-db
    environment:
      POSTGRES_USER:     zamtel
      POSTGRES_PASSWORD: zamtel_password
      POSTGRES_DB:       zamtel_tdr
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zamtel -d zamtel_tdr']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zamtel-tdr-backend
    environment:
      DATABASE_URL: postgresql://zamtel:zamtel_password@db:5432/zamtel_tdr
      JWT_SECRET:   change-this-in-production
      PORT:         3000
      NODE_ENV:     production
      CORS_ORIGIN:  http://localhost:4173
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zamtel-tdr-frontend
    ports:
      - '4173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
